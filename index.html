<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10111a;color:#f4f4f7;font-family:system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:4px 0}.sub{color:#aaa}.card{background:#191b28;border:1px solid #2b2e40;border-radius:18px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#222535;padding:10px;border-radius:12px}.bar{height:7px;background:#36394b;border-radius:9px;margin-top:5px;overflow:hidden}.fill{height:100%;background:#8b73ff}.age{font-size:44px;font-weight:900}.money{font-size:25px;font-weight:800}button,input,select{font:inherit}button{border:0;border-radius:11px;padding:11px 14px;background:#795cff;color:white;font-weight:700;cursor:pointer}.ghost{background:#292c3d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}input,select{width:100%;padding:11px;background:#11131d;color:white;border:1px solid #36394b;border-radius:10px;margin:5px 0}.event{font-size:17px;line-height:1.45}.choice{display:block;width:100%;text-align:left;margin-top:8px;background:#25283a}.people{display:grid;gap:8px}.person{display:flex;justify-content:space-between;background:#242737;padding:9px;border-radius:9px}.log{max-height:240px;overflow:auto;font-size:14px}.log div{padding:6px 0;border-bottom:1px solid #292c3c}.hidden{display:none}.ending{text-align:center;padding:35px}@media(max-width:750px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>👤 LIFE SIMULATOR</h1><div class="sub">проживи жизнь от 18 лет до старости</div></div><button class="ghost" onclick="location.reload()">Новая жизнь</button></div>
<section id="create" class="card"><h2>Создание персонажа</h2><input id="name" placeholder="Имя персонажа"><select id="trait"><option value="smart">🧠 Умный</option><option value="social">✨ Общительный</option><option value="hard">💪 Трудолюбивый</option><option value="lucky">🍀 Везучий</option><option value="creative">🎨 Творческий</option></select><input id="dream" placeholder="Мечта"><button onclick="start()">Начать жизнь</button></section>
<section id="game" class="hidden"><div class="grid"><main><div class="card"><div class="sub">возраст</div><div class="age" id="age"></div><div class="stats"><div class="stat">❤️ Здоровье<div id="health"></div></div><div class="stat">😊 Счастье<div id="happy"></div></div><div class="stat">⚡ Энергия<div id="energy"></div></div><div class="stat">⭐ Навык<div id="skill"></div></div></div><div class="money">💶 <span id="money"></span></div><div class="sub">Работа: <span id="job"></span></div><div class="sub">Мечта: <span id="dreamShow"></span></div></div>
<div class="card"><div class="sub">Событие года</div><div class="event" id="event"></div><div id="choices"></div><div class="actions"><button onclick="advance()">⏩ Прожить год</button><button class="ghost" onclick="study()">📚 Учиться</button><button class="ghost" onclick="work()">💼 Подработать</button><button class="ghost" onclick="relax()">🛋️ Отдохнуть</button></div></div></main>
<aside><div class="card"><h3>💞 Отношения</h3><div class="people" id="people"></div></div><div class="card"><h3>📜 История</h3><div class="log" id="log"></div></div></aside></div></section></div>
<script>
let p=null,used=false;const peopleNames=["Алекс","Мия","Лео","Софи","Ника","Макс","Эли","Дан"];
const events=[["💼 Тебе предложили новую работу.",["Принять — больше денег","Отказаться — больше свободного времени"]],["❤️ Ты познакомился с интересным человеком.",["Начать отношения","Остаться друзьями"]],["🎓 Можно поступить в университет.",["Поступить — -500€","Не поступать"]],["🏠 Ты нашёл красивую квартиру.",["Снять — -350€","Остаться где живёшь"]],["🎨 Хобби начало приносить деньги.",["Развивать — +навык","Продать идею — +600€"]],["🚗 Сломалась важная вещь.",["Заплатить 300€","Сэкономить и чинить самому"]],["✈️ Появилась возможность путешествовать.",["Поехать — -450€","Остаться дома"]],["🎉 Тебя пригласили на вечеринку.",["Пойти","Пропустить"]]];
function start(){p={name:name.value.trim()||"Алекс",age:18,money:800,health:82,happy:72,energy:88,skill:28,job:"Без работы",dream:dream.value.trim()||"Найти своё место в жизни",trait:trait.value,partner:null,friends:[],log:["18 лет — 🌱 Началась новая жизнь."]};create.classList.add("hidden");game.classList.remove("hidden");render();nextEvent()}
function bar(v){return Math.round(v)+'<div class="bar"><div class="fill" style="width:'+Math.max(0,Math.min(100,v))+'%"></div></div>'}
function render(){age.textContent=p.age;money.textContent=Math.round(p.money);job.textContent=p.job;dreamShow.textContent=p.dream;health.innerHTML=bar(p.health);happy.innerHTML=bar(p.happy);energy.innerHTML=bar(p.energy);skill.innerHTML=bar(p.skill);people.innerHTML=(p.partner?'<div class="person">❤️ '+p.partner+'<span>партнёр</span></div>':'')||'<div class="sub">пока никого</div>';log.innerHTML=p.log.slice().reverse().map(x=>'<div>'+x+'</div>').join('')}
function add(x){p.log.push(p.age+' лет — '+x)}
function nextEvent(){used=false;let e=events[Math.floor(Math.random()*events.length)];event.textContent=e[0];choices.innerHTML=e[1].map((x,i)=>'<button class="choice" onclick="choose('+i+')">'+x+'</button>').join('')}
function choose(i){if(used)return;used=true;choices.innerHTML='';if(i===0){p.money+=300;p.happy+=3;p.energy-=8;add('✨ Выбрал перемены.')}else{p.happy+=5;p.energy+=5;add('🌿 Выбрал спокойный путь.')}render()}
function study(){p.money-=60;p.skill+=8;p.energy-=12;p.happy-=2;add('📚 Учился и развивал навыки.');render()}
function work(){let g=80+Math.floor(p.skill*2);p.money+=g;p.energy-=18;p.happy-=5;p.skill+=2;add('💼 Подработал и заработал '+g+'€.');render()}
function relax(){p.energy+=15;p.happy+=9;p.health+=2;add('🛋️ Хорошо отдохнул.');render()}
function advance(){if(p.age>=90||p.health<=0)return end();p.age++;p.energy-=7;p.health-=2;if(p.job==="Без работы"&&p.age>=20){p.job=p.trait==="smart"?"Программист":p.trait==="creative"?"Дизайнер":p.trait==="social"?"Менеджер":"Специалист";p.money+=700;add('🎓 Начал карьеру: '+p.job+'.')}else if(p.job!=="Без работы")p.money+=Math.round(500+p.skill*5);if(p.age===25&&!p.partner&&Math.random()<.65){p.partner=peopleNames[Math.floor(Math.random()*peopleNames.length)];add('❤️ Начались отношения с '+p.partner+'.')}if(p.age===35&&p.partner){p.money-=900;add('🏠 Переехал в собственное жильё.')}if(Math.random()<.3){p.happy+=8;add('🍀 Случилось что-то приятное.')}render();if(p.age>=90||p.health<=0)end();else nextEvent()}
function end(){game.innerHTML='<div class="card ending"><div style="font-size:60px">🌅</div><h1>'+p.name+' — конец жизни</h1><p>Возраст: <b>'+p.age+'</b></p><p>Накопления: <b>'+Math.round(p.money)+'€</b></p><p>Навык: <b>'+Math.round(p.skill)+'</b> · Счастье: <b>'+Math.round(p.happy)+'</b></p><p>Мечта: <b>'+p.dream+'</b></p><button onclick="location.reload()">Начать новую жизнь</button></div>'}
</script></body></html>
